<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta property="og:title" content="お得家電リスト | ヤフショ家電せどり">
<meta property="og:description" content="ヤフショの実質価格と買取価格の差で利益が出る家電を毎日自動更新。価格・ポイント・在庫は変動するため各商品ページの最新表示をご確認ください。">
<meta property="og:url" content="https://kaden-otoku.pages.dev/">
<meta property="og:type" content="website">

<meta name="twitter:card" content="summary">
<title>お得家電リスト 2026/11/17 | ヤフショ家電せどり</title>
<style>
  /* レシート用紙の暖色ニュートラル。色は利益の緑だけ */
  :root { --bg:#f7f4ee; --paper:#fdfbf7; --raised:#efe9df; --line:rgba(31,27,22,.08);
           --ink:#1f1b16; --sub:#5e554a; --muted:#7b7266; --plus:#15803d;
           --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
         background:var(--bg); color:var(--ink); font-size:14px; line-height:20px; }
  p { margin:0; }
  .wrap { max-width:600px; margin:0 auto; padding:24px 16px 48px; }
  header h1 { font-size:24px; line-height:32px; font-weight:500; margin:0; }
  .meta { margin-top:4px; font-size:12px; line-height:16px; color:var(--muted);
          font-variant-numeric:tabular-nums; }
  .disclosure { margin-top:16px; padding:12px; border-radius:8px; background:var(--raised);
                font-size:13px; line-height:20px; color:var(--sub); }
  .disclosure .tag { display:inline-block; margin-right:8px; padding:0 6px; border-radius:4px;
                     border:1px solid var(--sub); font-size:12px; line-height:18px; color:var(--ink); }
  .sortbar { display:flex; align-items:center; justify-content:space-between; margin:24px 0 12px; }
  .sortlabel { font-size:12px; color:var(--muted); }
  .seg { display:flex; padding:2px; border-radius:8px; background:var(--raised); }
  .sortbtn { font:inherit; font-size:13px; padding:4px 12px; border:0; border-radius:6px;
             background:transparent; color:var(--sub); cursor:pointer;
             -webkit-appearance:none; appearance:none; transition:background-color .15s, color .15s; }
  .sortbtn.on { background:var(--paper); color:var(--ink); font-weight:500;
                box-shadow:0 1px 2px rgba(0,0,0,.05); }
  #cards { display:flex; flex-direction:column; gap:12px; }
  .card { display:grid; grid-template-columns:88px 1fr; gap:12px 16px; padding:16px;
          background:var(--paper); border:1px solid var(--line); border-radius:12px; }
  .card[hidden] { display:none; }
  .thumb { position:relative; display:block; width:88px; height:88px; }
  .thumb img, .thumb .noimg { width:88px; height:88px; object-fit:contain; border-radius:8px;
                              background:#fff; border:1px solid var(--line); }
  .thumb .noimg { display:flex; align-items:center; justify-content:center;
                  font-size:12px; color:var(--muted); }
  .rank { position:absolute; top:4px; left:4px; min-width:20px; height:20px; padding:0 4px;
          border-radius:4px; background:var(--paper); border:1px solid var(--line);
          font-family:var(--mono); font-size:12px; line-height:18px; text-align:center;
          color:var(--sub); font-variant-numeric:tabular-nums; }
  .info { min-width:0; align-self:center; }
  .name { font-size:15px; line-height:22px; font-weight:500; overflow-wrap:anywhere; }
  .shop { margin-top:4px; font-size:12px; line-height:16px; color:var(--muted); }
  /* 見せ場: レシートの計算行。等幅数字で桁をそろえ、合計線は点線 */
  .receipt { grid-column:1 / -1; margin:0; padding:12px 0 0; border-top:1px dashed rgba(31,27,22,.24);
             font-family:var(--mono); font-size:13px; line-height:20px; font-variant-numeric:tabular-nums; }
  .receipt .row { display:flex; justify-content:space-between; gap:16px; }
  .receipt dt { font-family:-apple-system,"Hiragino Sans",sans-serif; color:var(--sub); }
  .receipt dd { margin:0; color:var(--ink); white-space:nowrap; }
  .receipt .sum { margin-top:4px; padding-top:4px; border-top:1px dashed rgba(31,27,22,.24); }
  .receipt .sum dt, .receipt .sum dd { color:var(--ink); font-weight:500; }
  .receipt .profit { margin-top:8px; padding-top:8px; border-top:3px double rgba(31,27,22,.24);
                     align-items:baseline; }
  .receipt .profit dt { color:var(--ink); font-weight:500; }
  .receipt .profit dt span { margin-left:8px; font-family:var(--mono); font-weight:400; color:var(--plus); }
  .receipt .profit dd { font-size:18px; line-height:24px; font-weight:600; color:var(--plus); }
  .btn { grid-column:1 / -1; display:block; height:44px; line-height:44px; text-align:center;
         border-radius:8px; background:var(--ink); color:#fff; text-decoration:none;
         font-size:14px; font-weight:500; transition:background-color .15s; }
  .btn:hover { background:#3a342c; }
  .btn:focus-visible, .thumb:focus-visible, .sortbtn:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .empty { text-align:center; color:var(--muted); padding:48px 0; }
  footer { margin-top:32px; font-size:12px; line-height:20px; color:var(--muted); text-align:center; }
  @media (max-width:360px) {
    .card { grid-template-columns:72px 1fr; padding:12px; }
    .thumb, .thumb img, .thumb .noimg { width:72px; height:72px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>お得家電リスト</h1>
    <p class="meta">2026/11/17 の検索結果 · キャンペーン: なし</p>
  </header>
  <p class="disclosure"><span class="tag">広告</span>本ページはアフィリエイト広告（バリューコマース）を利用しています。価格・ポイント・在庫は変動するため、購入前に各商品ページの最新表示をご確認ください。</p>

  <div id="cards">
<p class="empty">本日の掲載商品はありません</p>
  </div>
  <footer>
    実質 = 買取価格 − 見込み利益（ポイント・クーポン還元後の実質支払額）<br>
    最終更新 2026/11/17 13:30<br>
    #ヤフーショッピング #ポイ活 #せどり
  </footer>
</div>
<script>
(function () {
  var LIMIT = 30;
  var wrap = document.getElementById('cards');
  if (!wrap) return;
  var btns = Array.prototype.slice.call(document.querySelectorAll('.sortbtn'));
  function apply(key) {
    var cards = Array.prototype.slice.call(wrap.querySelectorAll('.card'));
    cards.sort(function (a, b) {
      var d = parseFloat(b.dataset[key]) - parseFloat(a.dataset[key]);
      if (d) return d;
      return parseFloat(b.dataset.profit) - parseFloat(a.dataset.profit);
    });
    cards.forEach(function (c, i) {
      wrap.appendChild(c);
      c.hidden = i >= LIMIT;
      var r = c.querySelector('.rank');
      if (r) r.textContent = String(i + 1);
    });
    btns.forEach(function (b) {
      var on = b.dataset.key === key;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    try { localStorage.setItem('room_sort', key); } catch (e) {}
  }
  btns.forEach(function (b) {
    b.addEventListener('click', function () { apply(b.dataset.key); });
  });
  var saved = null;
  try { saved = localStorage.getItem('room_sort'); } catch (e) {}
  if (saved === 'margin') apply('margin');
})();
</script>
</body>
</html>
